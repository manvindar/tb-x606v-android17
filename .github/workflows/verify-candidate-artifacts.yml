name: Verify uploaded tablet candidate bytes
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Completed unpublished Build image run
        required: true
      candidate_source:
        description: Exact full source commit of that run
        required: true
      publish_nonpixel:
        description: Publish owner-requested experimental non-Pixel prerelease after verification
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
    steps:
      - uses: actions/checkout@v7
      - name: Check completed exact build identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > run.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('run.json'))
          assert r['status'] == 'completed' and r['conclusion'] == 'success'
          assert r['head_sha'] == os.environ['CANDIDATE_SOURCE']
          assert r['path'] == '.github/workflows/build-image.yml'
          PY
      - name: Retrieve the uploaded candidate
        run: gh run download "$CANDIDATE_RUN" -R "$GITHUB_REPOSITORY" -n system-a17-tb-x606v-DP11.261030.003 -D candidate
      - name: Verify every compressed and decompressed image byte
        run: |
          python3 - <<'PY'
          import hashlib, io, json, lzma, os, subprocess, zipfile
          from pathlib import Path
          root = Path('candidate')
          build = json.loads((root / 'build-receipt.json').read_text())
          assert build['source_commit'] == os.environ['CANDIDATE_SOURCE']
          assert build['actions_run'] == os.environ['CANDIDATE_RUN']
          assert build['device'] == 'TB-X606V' and build['system_bytes'] == 4085252096
          assert build['experimental_graphics'] and build['graphics_acceptance'] is False
          assert build['device_validation'] is False
          if '${{ inputs.publish_nonpixel }}' == 'true':
              assert build.get('full_pixel') is False
              assert build['gsi_build'] == 'DP11.261030.003'
              assert build['gsi_sha256'] == '1cb1c5254299581246ba626faccd41566df25382cd0415d8b82bf2e2d80cbf6c'
          if build.get('full_pixel'):
              assert build['pixel_factory_build'] == 'DP11.261030.003'
              assert build['pixel_factory_sha256'] == '3ee3196ede239145409bd47bb003b7f7a501587c0c92be7a13dd3c91aca5a0e6'
          checks = dict((name.lstrip('*'), sha) for sha, name in
                        (line.split(maxsplit=1) for line in (root / 'SHA256SUMS.txt').read_text().splitlines()))
          expected = {f'system-a17-tb-x606v-{flavor}-nodexopt.img.xz' for flavor in ('gapps', 'nogapps')}
          assert set(checks) == expected
          results = []
          for flavor in ('gapps', 'nogapps'):
              name = f'system-a17-tb-x606v-{flavor}-nodexopt.img.xz'
              with (root / name).open('rb') as stream:
                  packed_sha = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert packed_sha == checks[name], 'Compressed checksum mismatch: ' + name
              graphics = json.loads((root / f'graphics-{flavor}.json').read_text())
              assert graphics['status'] == 'experimental-mechanical-pass' and graphics['acceptance'] is False
              assert not graphics['donor_failures'] and not graphics['consumer_failures'] and not graphics['flag_provider_consumers']
              raw_hash = hashlib.sha256(); size = 0
              raw_path = root / 'verify-current.img'
              with lzma.open(root / name, 'rb') as stream, raw_path.open('wb') as raw:
                  for block in iter(lambda: stream.read(8 * 1024**2), b''):
                      size += len(block); raw_hash.update(block); raw.write(block)
              assert size == 4085252096 and raw_hash.hexdigest() == graphics['image_sha256']
              contents = []
              def read_image(path):
                  r = subprocess.run(['debugfs', '-R', 'cat ' + path, str(raw_path)], capture_output=True, check=True)
                  assert r.stdout, 'Missing/empty content: ' + path
                  contents.append({'path': path, 'bytes': len(r.stdout), 'sha256': hashlib.sha256(r.stdout).hexdigest()})
                  return r.stdout
              if '${{ inputs.publish_nonpixel }}' == 'true':
                  for path in ('/system/system_ext/priv-app/SystemUI/SystemUI.apk',
                               '/system/system_ext/priv-app/Settings/Settings.apk'):
                      with zipfile.ZipFile(io.BytesIO(read_image(path))) as apk:
                          assert 'AndroidManifest.xml' in apk.namelist() and apk.testzip() is None
                  for path in ('/system/system_ext/priv-app/NexusLauncherRelease/NexusLauncherRelease.apk',
                               '/system/bin/pixel_home.sh', '/system/etc/init/zz_pixel_home.rc'):
                      r = subprocess.run(['debugfs', '-R', 'stat ' + path, str(raw_path)], capture_output=True, check=True)
                      assert 'File not found' in r.stderr.decode(), 'Unexpected Pixel content: ' + path
              if build.get('full_pixel'):
                  for path in ('/system/system_ext/priv-app/SystemUI/SystemUI.apk',
                               '/system/system_ext/priv-app/Settings/Settings.apk',
                               '/system/system_ext/priv-app/NexusLauncherRelease/NexusLauncherRelease.apk'):
                      with zipfile.ZipFile(io.BytesIO(read_image(path))) as apk:
                          assert 'AndroidManifest.xml' in apk.namelist() and apk.testzip() is None
                  for path in ('/system/etc/healthshim.jar', '/system/etc/vibratorshim.jar',
                               '/system/bin/pixel_home.sh', '/system/etc/init/zz_pixel_home.rc'):
                      read_image(path)
                  props = read_image('/system/build.prop').decode()
                  assert 'persist.sysui.disableBlur=1' in props
                  assert 'pm.dexopt.install=speed' in props
                  assert 'pm.dexopt.install-bulk=speed' in props
                  cpu = read_image('/system/etc/init/cpustatsd.rc').decode()
                  assert '    start cpustatsd' not in cpu
              raw_path.unlink()
              results.append({'file': name, 'compressed_sha256': packed_sha,
                              'compressed_bytes': (root / name).stat().st_size,
                              'raw_sha256': raw_hash.hexdigest(), 'raw_bytes': size,
                              'unknown_graphics_callers': graphics['unreviewed_caller_count'],
                              'graphics_acceptance': False,
                              'full_pixel_content': contents if build.get('full_pixel') else [],
                              'nonpixel_content': contents if not build.get('full_pixel') else []})
              print(flavor + ': full uploaded compressed/raw byte verification PASS', flush=True)
          Path('artifact-verification.json').write_text(json.dumps({
              'candidate_run': os.environ['CANDIDATE_RUN'],
              'source_commit': os.environ['CANDIDATE_SOURCE'],
              'status': 'complete-uploaded-artifact-hash-pass', 'images': results,
              'device_actions': False, 'device_validation': False,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tablet-candidate-byte-verification
          path: |
            artifact-verification.json
            run.json
            candidate/SHA256SUMS.txt
            candidate/build-receipt.json
          if-no-files-found: error

      - name: Publish verified experimental non-Pixel prerelease
        if: inputs.publish_nonpixel
        env:
          RELEASE_TAG: v17-qpr3-beta4-nonpixel-r1
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" candidate/*.img.xz candidate/SHA256SUMS.txt \
            candidate/build-receipt.json candidate/graphics-*.json artifact-verification.json \
            --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SOURCE" --draft --prerelease \
            --title "Android 17 QPR3 Beta 4 (DP11.261030.003) — non-Pixel TB-X606V, experimental" \
            --notes-file docs/RELEASE_NOTES_NONPIXEL_BETA4.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-assets.json
          python3 - <<'PYVERIFY'
          import hashlib, json
          from pathlib import Path
          assets = {a['name']: a for a in json.loads(Path('release-assets.json').read_text())['assets']}
          files = list(Path('candidate').glob('*.img.xz')) + [Path('candidate/SHA256SUMS.txt'), Path('candidate/build-receipt.json'), Path('artifact-verification.json')] + list(Path('candidate').glob('graphics-*.json'))
          assert len(assets) == len(files)
          for p in files:
              a = assets[p.name]
              assert a['size'] == p.stat().st_size
              # GitHub release API exposes uploaded-asset digests; verify when present.
              if a.get('digest'):
                  with p.open('rb') as f: digest = 'sha256:' + hashlib.file_digest(f, 'sha256').hexdigest()
                  assert a['digest'] == digest
          PYVERIFY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
