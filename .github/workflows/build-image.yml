name: Build image

# Builds the patched Android 17 system images (gapps and nogapps) for the Lenovo TB-X606V from public inputs and optionally publishes them as a release.
# Not included (proprietary or tablet-specific): Dolby Atmos, the vendor edits (tools/scripts/apply_vendor_a17.sh, applied by install_a17.sh) and compiled app code (the image compiles itself on first boot).
#
# mode "check" only downloads the GSI and runs build/check_patches.py (a minute or two): it lists every patch that no longer applies to that GSI build, all at once.
# The big downloads (GSI zip, donor 7z) are cached by checksum, so a repeated or re-run build does not fetch them again.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: check = only test which patches apply to the GSI; build = build the images
        type: choice
        options: [build, check]
        default: build
      publish:
        description: Publish a GitHub release with the images (build mode)
        type: boolean
        default: false
      experimental_graphics:
        description: Build-only legacy graphics candidate; caller/runtime acceptance remains false
        type: boolean
        default: false
      full_pixel:
        description: Include matching Beta4 Pixel Tablet UI, launcher and app layer
        type: boolean
        default: false
      tag:
        description: Release tag (used when publishing)
        default: v17-dp11-ci
      gsi_build:
        description: Build id of the GSI (for the log and release title), e.g. DP11.261016.003; empty = the build set in this file
        default: ''
      gsi_url:
        description: Google GSI zip (aosp_arm64) to patch; empty = the build set in this file
        default: ''
      gsi_zip_sha256:
        description: SHA-256 of that zip as published by Google (required with gsi_url)
        default: ''
  push:
    tags: ['a17-v*']

env:
  # The build the patches were developed on. DP11.261016.003 (October 29, 2026) is built from the exp/ branches:
  #   https://dl.google.com/developers/android/cinnamonbun/images/gsi/aosp_arm64-exp-DP11.261016.003-16708287-d735a3b1.zip  sha256 d735a3b11fe1b76a736f325f5500f7211167642fe2ed39dae0cf530d1cf51436
  GSI_BUILD: ${{ inputs.gsi_build || (inputs.gsi_url && 'custom' || 'DP11.261002.005') }}
  GSI_URL: ${{ inputs.gsi_url || 'https://dl.google.com/developers/android/cinnamonbun/images/gsi/aosp_arm64-exp-DP11.261002.005-16594701-a359a50b.zip' }}
  GSI_ZIP_SHA256: ${{ inputs.gsi_zip_sha256 || 'a359a50b6eb8e9f63168e928bd14167603225e92cd8605ec86a4bda6591fc13b' }}
  DONOR_URL: https://sourceforge.net/projects/misterztr-gsi/files/LineageOS/Android%2016/LineageOS-23.2-20260524-GAPPS-EXT4-GSI.7z/download
  DONOR_7Z_SHA256: 22b3c069445cc3d54819361a1636f7b27ff455dc547f300b868cecddb1b2e22d
  DONOR_IMG: LineageOS-23.2-20260524-GAPPS-EXT4-GSI.img

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Reject publishing unaccepted experimental graphics
        if: inputs.experimental_graphics && inputs.publish
        run: exit 1
      - uses: actions/checkout@v7

      - name: Android 16 port repo (ROM Tuner, boot animations)
        if: inputs.mode != 'check'
        uses: actions/checkout@v7
        with:
          repository: manvindar/tb-x606v-android16-port
          path: port

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - uses: mlugg/setup-zig@v2
        if: inputs.mode != 'check'
        with: { version: 0.14.1 }

      - uses: actions/setup-java@v6
        if: inputs.mode != 'check'
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v4
        if: inputs.mode != 'check'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs erofs-utils p7zip-full xz-utils zip unzip openssl
          pip install capstone
          if [ "${{ inputs.mode }}" != "check" ]; then
            sdkmanager "build-tools;35.0.0" "platforms;android-34" "ndk;26.1.10909125"
            zig version
          fi
          debugfs -V; fsck.erofs --help 2>&1 | head -1

      - name: Cached GSI zip
        id: gsicache
        uses: actions/cache/restore@v6
        with:
          path: gsi.zip
          key: gsi-${{ env.GSI_ZIP_SHA256 }}

      - name: Download Google's Android 17 GSI (${{ env.GSI_BUILD }})
        run: |
          echo "GSI build ${GSI_BUILD}: ${GSI_URL}"
          if [ ! -f gsi.zip ]; then curl -L --fail --retry 5 --retry-delay 10 -o gsi.zip "$GSI_URL"; else echo "gsi.zip restored from the cache"; fi
          echo "$GSI_ZIP_SHA256  gsi.zip" | sha256sum -c -

      - name: Cache the GSI zip
        if: steps.gsicache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: gsi.zip
          key: gsi-${{ env.GSI_ZIP_SHA256 }}

      - name: Unpack the GSI
        run: |
          unzip -o -q gsi.zip system.img && rm gsi.zip
          sha256sum system.img

      - name: Which patches apply to this GSI
        run: python build/check_patches.py system.img
        continue-on-error: ${{ inputs.mode != 'check' }}

      - name: Cached donor
        if: inputs.mode != 'check'
        id: donorcache
        uses: actions/cache/restore@v6
        with:
          path: donor.7z
          key: donor-${{ env.DONOR_7Z_SHA256 }}

      - name: Download the LineageOS 23.2 GSI (donor)
        if: inputs.mode != 'check'
        run: |
          if [ ! -f donor.7z ]; then curl -L --fail --retry 5 --retry-delay 10 -o donor.7z "$DONOR_URL"; else echo "donor.7z restored from the cache"; fi
          echo "$DONOR_7Z_SHA256  donor.7z" | sha256sum -c -

      - name: Cache the donor
        if: inputs.mode != 'check' && steps.donorcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: donor.7z
          key: donor-${{ env.DONOR_7Z_SHA256 }}

      - name: Unpack the donor
        if: inputs.mode != 'check'
        run: |
          7z x -y donor.7z "$DONOR_IMG" && rm donor.7z
          ls -la "$DONOR_IMG"

      - name: Download MindTheGapps
        if: inputs.mode != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=MindTheGapps/16.0.0-arm64
          TAG=$(gh release list -R $REPO --limit 1 --json tagName -q '.[0].tagName')
          mkdir gapps && cd gapps && gh release download "$TAG" -R $REPO -p '*.zip' -p '*.sha256sum'
          sha256sum -c *.sha256sum

      - name: Regression checks for scoped Beta 4 ports
        if: inputs.mode != 'check'
        run: |
          python -m unittest discover -s build -p 'test_*.py' -v
          python -m unittest discover -s tools/libc -p test_budget_watchers.py -v
          python -m unittest discover -s tools/bpf -p 'test_*.py' -v
          python -m unittest discover -s tools/graphics -p 'test_*.py' -v
      - uses: actions/cache/restore@v6
        if: inputs.experimental_graphics && inputs.mode != 'check'
        id: legacycache
        with:
          path: legacy-gsi.zip
          key: gsi-d735a3b11fe1b76a736f325f5500f7211167642fe2ed39dae0cf530d1cf51436
      - name: Stage exact legacy mapper compatibility provider
        if: inputs.experimental_graphics && inputs.mode != 'check'
        run: |
          python tools/graphics/stage_legacy.py docs/BETA4-INPUTS.json legacy_graphics --archive-cache legacy-gsi.zip
          export PATH="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          python tools/graphics/build_sync_provider.py "$ANDROID_HOME/ndk/26.1.10909125" legacy_graphics/sync-provider
      - uses: actions/cache/save@v6
        if: inputs.experimental_graphics && inputs.mode != 'check' && steps.legacycache.outputs.cache-hit != 'true'
        with:
          path: legacy-gsi.zip
          key: gsi-d735a3b11fe1b76a736f325f5500f7211167642fe2ed39dae0cf530d1cf51436
      - name: Release verified legacy archive
        if: inputs.experimental_graphics && inputs.mode != 'check'
        run: rm -- legacy-gsi.zip
      - name: Stage matching Beta4 Pixel Tablet apps
        if: inputs.mode != 'check' && inputs.full_pixel
        env:
          FACTORY_URL: https://dl.google.com/developers/android/cinnamonbun/images/factory/tangorpro_beta-dp11.261030.003-factory-3ee3196e.zip
          FACTORY_SHA256: 3ee3196ede239145409bd47bb003b7f7a501587c0c92be7a13dd3c91aca5a0e6
        run: |
          test "$GSI_BUILD" = DP11.261030.003
          curl -L --fail --retry 5 --retry-delay 10 -o factory.zip "$FACTORY_URL"
          echo "$FACTORY_SHA256  factory.zip" | sha256sum -c -
          python3 tools/pixel/stage_pixel_tablet.py factory.zip pixel_stage --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          rm factory.zip

      - name: Build the images
        if: inputs.mode != 'check'
        run: |
          set -o pipefail
          graphics_options=()
          if [ "${{ inputs.full_pixel }}" = true ]; then graphics_options+=(--pixel-tablet pixel_stage); fi
          if [ "${{ inputs.experimental_graphics }}" = true ]; then graphics_options+=(--legacy-graphics legacy_graphics); fi
          python build/build_image17.py "${graphics_options[@]}" --gsi system.img --donor "$DONOR_IMG" --out system-a17-nogapps.img \
            --gapps gapps/*.zip --out-gapps system-a17-gapps.img --port-repo port \
            --workdir build-work --build-tools "$ANDROID_HOME/build-tools/35.0.0" 2>&1 | tee image-build.log
          rm system.img "$DONOR_IMG"
          ls -la *.img

      - name: Retain image writer diagnostics
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v7
        with:
          name: lenovo-beta4-image-writer-diagnostics
          path: |
            image-build.log
            build-work/debugfs-*.log
            build-work/cmds
          if-no-files-found: warn

      - name: Check the images
        if: inputs.mode != 'check'
        run: |
          for f in system-a17-nogapps.img system-a17-gapps.img; do
            [ "$(stat -c %s $f)" = 4085252096 ]
            e2fsck -fn $f
          done
          debugfs -R 'ls -l /system/lib64/a16audio' system-a17-nogapps.img | wc -l
          debugfs -R 'stat /system/product/priv-app/GmsCore/GmsCore.apk' system-a17-gapps.img | head -1

      - name: Final both-ABI graphics linkage and image readback
        if: inputs.experimental_graphics && inputs.mode != 'check'
        run: |
          python tools/graphics/verify_final.py system-a17-nogapps.img legacy_graphics graphics-nogapps.json --experimental-dirty-flash
          python tools/graphics/verify_final.py system-a17-gapps.img legacy_graphics graphics-gapps.json --experimental-dirty-flash
      - uses: actions/upload-artifact@v7
        if: always() && inputs.experimental_graphics
        with:
          name: lenovo-beta4-graphics-evidence
          path: |
            graphics-*.json
            legacy_graphics/*receipt.json
            legacy_graphics/abi-consumers/
            legacy_graphics/binding-configuration/
          if-no-files-found: warn
      - name: Compress
        if: inputs.mode != 'check'
        run: |
          xz -T0 -6 -c system-a17-gapps.img > system-a17-tb-x606v-gapps-nodexopt.img.xz
          xz -T0 -6 -c system-a17-nogapps.img > system-a17-tb-x606v-nogapps-nodexopt.img.xz
          rm system-a17-gapps.img system-a17-nogapps.img
          sha256sum *.img.xz | tee SHA256SUMS.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          experimental = '${{ inputs.experimental_graphics }}' == 'true'
          Path('build-receipt.json').write_text(json.dumps({
              'full_pixel': '${{ inputs.full_pixel }}' == 'true',
              'pixel_factory_build': 'DP11.261030.003' if '${{ inputs.full_pixel }}' == 'true' else None,
              'pixel_factory_sha256': '3ee3196ede239145409bd47bb003b7f7a501587c0c92be7a13dd3c91aca5a0e6' if '${{ inputs.full_pixel }}' == 'true' else None,
              'source_commit': os.environ['GITHUB_SHA'], 'actions_run': os.environ['GITHUB_RUN_ID'],
              'gsi_build': os.environ['GSI_BUILD'], 'gsi_sha256': os.environ['GSI_ZIP_SHA256'],
              'device': 'TB-X606V', 'system_bytes': 4085252096, 'experimental_graphics': experimental,
              'graphics_acceptance': False, 'device_validation': False,
              'scope': 'Build only; no tablet write/reboot; static/mechanical guards are not runtime proof'
          }, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v7
        if: inputs.mode != 'check'
        with:
          name: system-a17-tb-x606v-${{ env.GSI_BUILD }}
          path: |
            system-a17-tb-x606v-*.img.xz
            SHA256SUMS.txt
            build-receipt.json
            graphics-*.json
          retention-days: 14
          compression-level: 0

      - name: Publish release
        if: ${{ inputs.mode != 'check' && (github.event_name == 'push' || inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" system-a17-tb-x606v-*.img.xz SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" system-a17-tb-x606v-*.img.xz SHA256SUMS.txt --prerelease \
              --title "Android 17 ($GSI_BUILD) for TB-X606V, built by GitHub Actions ($TAG)" --notes-file docs/RELEASE_NOTES_CI.md
          fi
