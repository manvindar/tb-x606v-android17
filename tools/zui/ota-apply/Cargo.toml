[package]
name = "ota-apply"
version = "0.1.0"
edition = "2021"
description = "Apply an Android A/B incremental payload.bin to verified base partition images (host tool for HAG-43 donor extraction)"

[dependencies]
puffdiff = "=0.1.0"
bsdiff-android = "=0.0.2"
sha2 = "0.10"
bzip2 = { version = "0.6", features = ["static"] }
xz2 = { version = "0.1", features = ["static"] }

[profile.release]
opt-level = 3
